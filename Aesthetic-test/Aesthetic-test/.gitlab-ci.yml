# GitLab CI Configuration for Card Aesthetic Scoring System
# 
# This pipeline:
# 1. Installs dependencies
# 2. Runs the full test suite
# 3. Runs aesthetic scoring on sample cards (if available)
# 4. Fails the pipeline if any card scores FAIL

stages:
  - test
  - score

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # RapidOCR不需要额外环境变量

cache:
  paths:
    - .pip-cache/
    - .paddlex/

# ---------------------------------------------------------------------------
# Test Stage
# ---------------------------------------------------------------------------

test:
  stage: test
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --tb=short --cov=card_scorer --cov-report=term --cov-report=html
  artifacts:
    paths:
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ---------------------------------------------------------------------------
# Score Stage (runs on sample cards)
# ---------------------------------------------------------------------------

score_samples:
  stage: score
  image: python:3.11
  needs: ["test"]
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - |
      for img in tests/fixtures/*.png; do
        if [ -f "$img" ]; then
          echo "Scoring: $img"
          python -m card_scorer.cli.main \
            --image "$img" \
            --query "sample query" \
            --output "reports/$(basename $img .png)/"
        fi
      done
  artifacts:
    paths:
      - reports/
    when: always
  allow_failure: true
