# Card Aesthetic Scoring System - Detection Thresholds
# All thresholds are configurable; never hardcode in rule implementations.

# --- Information Completeness ---
information:
  keyword_missing_max_deduction: 10
  keyword_missing_per_item: 5
  truncation_confidence_threshold: 0.6
  truncation_deduction: 8
  redundancy_similarity_threshold: 0.85
  redundancy_deduction: 5
  entity_missing_deduction: 7

# --- Layout & Whitespace ---
layout:
  edge_margin_min_px: 16
  edge_deduction: 5
  overlap_iou_threshold: 0.05
  overlap_deduction: 8
  whitespace_ratio_min: 0.20
  whitespace_ratio_max: 0.70
  whitespace_deduction: 5
  element_overflow_deduction: 8

# --- Visual Consistency ---
consistency:
  alignment_cluster_eps: 5
  alignment_deduction: 6
  spacing_variance_threshold: 0.3
  spacing_deduction: 5
  font_size_levels_max: 4
  font_rhythm_deduction: 4
  component_rhythm_deduction: 4
  icon_ratio_min: 0.02
  icon_ratio_max: 0.15
  icon_proportion_deduction: 3
  text_image_ratio_min: 0.3
  text_image_ratio_max: 0.8
  text_image_ratio_deduction: 3
  margin_consistency_threshold: 0.25
  margin_consistency_deduction: 3
  grid_alignment_deduction: 3

# --- Color Harmony ---
color:
  max_dominant_colors: 5
  too_many_colors_deduction: 5
  contrast_ratio_min: 4.5
  contrast_deduction: 5
  saturation_max: 0.9
  high_saturation_deduction: 3
  hue_conflict_threshold: 30
  color_conflict_deduction: 5

# --- Visual Hierarchy ---
hierarchy:
  visual_center_offset_max: 0.15
  visual_center_deduction: 4
  quadrant_density_ratio_max: 3.0
  density_balance_deduction: 3
  heading_body_ratio_min: 1.2
  heading_body_ratio_max: 2.5
  size_hierarchy_deduction: 3

# --- Structure (DSL-based, Phase 3) ---
structure:
  max_nesting_depth: 5
  nesting_deduction: 3
  empty_container_deduction: 3
  border_radius_levels_max: 3
  border_radius_deduction: 2
  decoration_count_max: 3
  decoration_deduction: 2

# --- OCR Engine ---
ocr:
  lang: "ch"
  use_angle_cls: true
  det_db_thresh: 0.3
  rec_score_threshold: 0.5

# --- Connected Components ---
connected_components:
  min_area: 50
  max_area_ratio: 0.5
  background_threshold: 240
