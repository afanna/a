# Card Aesthetic Scoring System - Dimension Weights
# Total: 100 points (pure deduction system)

dimensions:
  information:
    name: "信息完整性"
    max_deduction: 25
    priority: "P0"

  layout:
    name: "布局与留白"
    max_deduction: 20
    priority: "P0-P1"

  consistency:
    name: "视觉一致性"
    max_deduction: 20
    priority: "P1"

  color:
    name: "色彩和谐度"
    max_deduction: 15
    priority: "P0-P2"

  hierarchy:
    name: "视觉层级"
    max_deduction: 10
    priority: "P1-P2"

  structure:
    name: "结构规范"
    max_deduction: 10
    priority: "P2"

# FAIL threshold: if any P0 rule triggers FAIL,
# total score is capped at 60
fail_cap: 60
base_score: 100
