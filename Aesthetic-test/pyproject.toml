[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "card-scorer"
version = "0.1.0"
description = "Card Aesthetic Scoring System - Automatically filter ugly cards"
requires-python = ">=3.11"

[project.scripts]
card-scorer = "card_scorer.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["card_scorer*"]
